name: 每日更新水位資料

on:
  schedule:
    # 備援用：主要由 Cloudflare Worker 準時觸發（見 cloudflare/trigger-worker.js）。
    # 台北 16:00 與 17:00（UTC 08:00、09:00），週一到週五：收盤資料
    - cron: "0 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    # 台北 07:00（UTC 前一日 23:00），週一到週五早上：盤前參考
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily＝收盤資料；premarket＝盤前參考"
        type: string
        default: "daily"
      backfill:
        description: "回補最近 N 個日曆日（0＝只抓今天，僅 daily）"
        type: string
        default: "0"
      date:
        description: "指定日期 YYYY-MM-DD（留空＝今天）"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || (github.event.schedule == '0 23 * * 0-4' && 'premarket') || 'daily' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 抓取資料
        run: |
          if [ "$MODE" = "premarket" ]; then
            python scripts/fetch.py --premarket ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          else
            python scripts/fetch.py --backfill "${{ inputs.backfill || '0' }}" ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          fi
      - name: 資料健康檢查（連續 2 個交易日缺資料就開 Issue 通知）
        id: health
        if: env.MODE != 'premarket'
        continue-on-error: true
        run: python scripts/check_health.py --days 2
      - name: 開立或關閉異常通知
        if: env.MODE != 'premarket' && steps.health.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-alert --color d73a4a --description "資料來源異常" 2>/dev/null || true
          open=$(gh issue list --label data-alert --state open --json number --jq '.[0].number')
          if [ "${{ steps.health.outputs.problems }}" != "0" ]; then
            if [ -z "$open" ]; then
              gh issue create --title "資料異常：部分商品連續抓不到資料" --label data-alert --body-file health_issue.md
            else
              gh issue edit "$open" --body-file health_issue.md  # 已有通知就只更新內容，不重複寄信
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "$(TZ=Asia/Taipei date +%F) 所有商品資料已恢復正常。"
          fi
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "無新資料" && exit 0
          git commit -m "data: $(TZ=Asia/Taipei date +%F) $([ "$MODE" = premarket ] && echo 盤前參考 || echo 收盤資料)"
          git pull --rebase -q origin main
          git push
